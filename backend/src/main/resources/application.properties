# Sunucu Portunu 8000 yapıyoruz (React ile uyumlu olması için)
server.port=8000

# MSSQL Veritabanı Bağlantı Ayarları
# 'databaseName' kısmına kendi veritabanının adını yaz
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=SayacAnalizDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=username
spring.datasource.password=password
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA Ayarları (SQL komutlarını konsolda görmek ve tabloları otomatik yönetmek için)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true